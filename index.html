function memStore(){const m=new Map(),L=[];const emit=()=>L.forEach(f=>f());return{
  sub(p,cb){const f=()=>cb(m.has(p)?clone(m.get(p)):null);L.push(f);f()},
  subCol(c,cb){const n=c.split("/").length+1;const f=()=>cb([...m.entries()].filter(([p])=>p.startsWith(c+"/")&&p.split("/").length===n).map(([p,d])=>({id:p.split("/").pop(),data:clone(d)})));L.push(f);f()},
  async get(p){return m.has(p)?clone(m.get(p)):null},
  async set(p,d){m.set(p,clone(d));emit()},
  async del(p){m.delete(p);emit()}}}
function liveStore(db){return{
  sub(p,cb){db.doc(p).onSnapshot(s=>cb(s.exists?clone(s.data()):null),e=>console.warn(p,e))},
  subCol(c,cb){db.collection(c).onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,data:clone(d.data())}))),e=>console.warn(c,e))},
  async get(p){const s=await db.doc(p).get();return s.exists?clone(s.data()):null},
  async set(p,d){await db.doc(p).set(d)},
  async del(p){await db.doc(p).delete()}}}
async function safe(fn,okMsg){try{await fn();if(okMsg)toast(okMsg);return true}catch(e){console.warn(e);toast(e&&e.code==="invalid_argument"?"You don't have permission to change that.":"Couldn't save. Check your connection and try again.");return false}}

function quote(d=D){
  const v=C.vehicles.find(x=>x.id===d.vehicle)||C.vehicles[0];
  const svc=d.services.map(id=>C.services.find(s=>s.id===id)).filter(Boolean);
  const add=d.addons.map(id=>C.shop.find(s=>s.id===id)).filter(Boolean);
  const svcTotal=r2(svc.reduce((a,s)=>a+ +s.price,0)*v.mult);
  const addTotal=r2(add.reduce((a,s)=>a+ +s.price,0));
  const promo=(S.promos||[]).find(p=>p.active&&p.code&&p.code.toUpperCase()===(d.promo||"").trim().toUpperCase());
  const discount=promo?r2(svcTotal*promo.pct/100):0;
  let travel=0;if(d.loc&&d.loc.dist!=null&&d.loc.dist>S.radius&&S.travelFee>0)travel=r2((d.loc.dist-S.radius)*S.travelFee);
  const total=r2(svcTotal+addTotal-discount+travel);
  const deposit=r2(Math.max(total*S.depositPct/100,total>0?1:0));
  return{v,svc,add,svcTotal,addTotal,promo,discount,travel,total,deposit,mins:svc.reduce((a,s)=>a+ +s.mins,0)};
}
function areaStatus(loc){if(!loc)return"none";if(loc.dist==null)return"unsure";if(loc.dist<=S.radius)return"in";return S.travelFee>0?"fee":"out"}
function slotKey(date,time){return date+"T"+time.replace(":","")}
function taken(date,time){const m=SLOTS[date.slice(0,7)]||{};return !!m[slotKey(date,time)]}
function dayOpen(date){const d=at(date);return(S.hours.days||[]).includes(d.getDay())&&!(S.closed||[]).includes(date)}
function daySlots(date,ignoreKey){
  if(!dayOpen(date))return[];const out=[];const s=toMin(S.hours.start),e=toMin(S.hours.end),st=+S.hours.slot||90;
  for(let m=s;m+st<=e+1;m+=st){const t=fromMin(m);const k=slotKey(date,t);const busy=taken(date,t)&&k!==ignoreKey;const soon=at(date,t)-Date.now()<(S.leadHours||0)*3600e3;out.push({t,ok:!busy&&!soon})}
  return out;
}
async function setSlot(date,time,val){const mk=date.slice(0,7);const cur=(await store.get("slots/"+mk))||{};if(val)cur[slotKey(date,time)]=val;else delete cur[slotKey(date,time)];await store.set("slots/"+mk,cur)}

/* ---------- radar map (SVG) ---------- */
function radar({pins=[],showTowns=true,size=440}={}){
  const R=+S.radius||25,span=Math.max(R*1.3,(S.towns||[]).reduce((a,t)=>Math.max(a,+t.mi||0),0)*1.08,8);
  const c=size/2,k=(c-18)/span,step=span>60?20:span>30?10:5;let g="";
  for(let r=step;r<span;r+=step)g+=`<circle cx="${c}" cy="${c}" r="${r*k}" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${c+4}" y="${c-r*k-4}">${r} mi</text>`;
  g+=`<line x1="${c}" y1="12" x2="${c}" y2="${size-12}" stroke="var(--line)"/><line x1="12" y1="${c}" x2="${size-12}" y2="${c}" stroke="var(--line)"/>`;
  g+=`<circle cx="${c}" cy="${c}" r="${R*k}" fill="color-mix(in srgb,var(--wax) 16%,transparent)" stroke="var(--wax)" stroke-width="2.5"/>`;
  g+=`<text x="${c+R*k*.707+6}" y="${c+R*k*.707+14}" style="fill:var(--wax);font-weight:800">${R} mi service area</text>`;
  if(showTowns)(S.towns||[]).forEach(t=>{const a=(hsh(t.name)%360)*Math.PI/180,x=c+Math.cos(a)*t.mi*k,y=c+Math.sin(a)*t.mi*k,inn=t.mi<=R;
    g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${inn?"var(--wax)":"var(--ink2)"}"/><text x="${x+7}" y="${y+4}">${esc(t.name)}</text>`});
  pins.forEach(p=>{if(p.lat==null)return;const dx=(p.lng-S.base.lng)*69.17*Math.cos(S.base.lat*Math.PI/180),dy=(p.lat-S.base.lat)*69;
    let x=c+dx*k,y=c-dy*k;x=Math.max(10,Math.min(size-10,x));y=Math.max(10,Math.min(size-10,y));
    g+=`<g><circle cx="${x}" cy="${y}" r="9" fill="var(--beacon)" stroke="var(--ink)" stroke-width="2"/>${p.label?`<text x="${x+12}" y="${y+4}" style="fill:var(--ink);font-weight:800">${esc(p.label)}</text>`:""}</g>`});
  g+=`<circle cx="${c}" cy="${c}" r="8" fill="var(--ink)"/><circle cx="${c}" cy="${c}" r="3" fill="var(--beacon)"/><text x="${c+12}" y="${c+16}" style="fill:var(--ink);font-weight:800">${esc(S.baseLabel||"Base")}</text>`;
  return`<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="Service area map, ${R} mile radius">${g}</svg>`;
}
function locFromGPS(cb){
  if(!navigator.geolocation){toast("Location isn't available on this device. Pick your town instead.");return}
  navigator.geolocation.getCurrentPosition(p=>{const pt={lat:p.coords.latitude,lng:p.coords.longitude};cb({method:"gps",...pt,dist:r2(miles(S.base,pt))})},
    ()=>toast("Location permission was blocked. Pick your town from the list instead."),{enableHighAccuracy:false,timeout:10000});
}
function areaMsg(loc){const s=areaStatus(loc);
  if(s==="in")return`<div class="okbox">You're ${loc.dist} mi from us, inside our ${S.radius} mi area. We'll come to you.</div>`;
  if(s==="fee")return`<div class="note">You're ${loc.dist} mi away, ${r2(loc.dist-S.radius)} mi past our area. A travel fee of ${money((loc.dist-S.radius)*S.travelFee)} applies.</div>`;
  if(s==="out")return`<div class="note">You're ${loc.dist} mi away. We currently serve up to ${S.radius} mi. Call ${esc(S.phone)} and we'll see what we can do.</div>`;
  if(s==="unsure")return`<div class="note">No problem. We'll confirm your address is within ${S.radius} mi before your appointment.</div>`;return""}
function townOptions(sel){return`<option value="">Choose your town…</option>`+(S.towns||[]).map((t,i)=>`<option value="${i}" ${sel===t.name?"selected":""}>${esc(t.name)} (${t.mi} mi)</option>`).join("")+`<option value="unsure" ${sel==="unsure"?"selected":""}>I'm not sure / not listed</option>`}
function locFromTown(v){if(v==="")return null;if(v==="unsure")return{method:"unsure",town:"unsure",dist:null};const t=S.towns[+v];return{method:"town",town:t.name,dist:+t.mi,lat:null,lng:null}}

function luhn(n){let s=0,a=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(a){d*=2;if(d>9)d-=9}s+=d;a=!a}return s%10===0}

function txns(){const out=[];

  modal(`<h3>${ref?"Record refund":"Collect payment"}: ${esc(b.cust.first)}</h3><p class="muted">Total ${money(b.total)} · Paid ${money(paid(b))} · Balance ${money(due)}</p>

function render(){
  const parts=location.hash.split("/"),r=parts[1]||"",arg=parts[2];
  const keep={},key=location.hash+OWN.tab;
  if(render._k===key)$$("[data-keep]",$("#app")).forEach(el=>keep[el.id]=(el.type==="checkbox"||el.type==="radio")?el.checked:el.value);
  const y=scrollY;
  const v={"":pHome,services:pServices,shop:pShop,blog:()=>pBlog(arg),deals:pDeals,book:pBook,account:pAccount,owner:pOwner}[r]||pHome;
  $("#app").innerHTML=v();chrome();
  for(const id in keep){const el=document.getElementById(id);if(!el)continue;if(el.type==="checkbox"||el.type==="radio")el.checked=keep[id];else el.value=keep[id]}
  if(render._k===key)scrollTo(0,y);render._k=key;
  const ba=$("#baR");if(ba)ba.addEventListener("input",()=>$("#ba").style.setProperty("--cut",ba.value+"%"));
}

function readCatalog(){$$(".edit-row").forEach(row=>{const arr=row.dataset.k==="svc"?C.services:C.shop,it=arr[+row.dataset.i];if(!it)return;$$("[data-f]",row).forEach(f=>{it[f.dataset.f]=["price","mins"].includes(f.dataset.f)?+f.value||0:f.value})});
  C.vehicles.forEach((v,i)=>{const el=$("#vm"+i);if(el)v.mult=+el.value||1});(C.plans||[]).forEach((p,i)=>{if($("#plN"+i)){p.name=$("#plN"+i).value;p.desc=$("#plD"+i).value;p.price=+$("#plP"+i).value||0}})}
function saveSettingsDoc(msg){return safe(()=>store.set("site/settings",S),msg)}
function updPay(){const q=quote();$("#payNowV").textContent=money(D.payNow);$("#payR").value=D.payNow;const rest=r2(q.total-D.payNow);$("#restV")&&($("#restV").textContent=money(rest));$("#restBox").classList.toggle("hide",rest<=0);
  const b=$("#payBtn");if(b&&!(S.payMode==="link"&&S.payLink))b.textContent=`Pay ${money(D.payNow)} and book`}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==="BUTTON")e.preventDefault();f(el,e)});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer()}});
document.addEventListener("change",e=>{const el=e.target,ch=el.dataset.ch;
  if(ch==="veh"){D.vehicle=el.value;saveDraft();render()}
  if(ch==="svc"){D.services=el.checked?[...D.services,el.value]:D.services.filter(x=>x!==el.value);saveDraft();render()}
  if(ch==="add"){D.addons=el.checked?[...D.addons,el.value]:D.addons.filter(x=>x!==el.value);saveDraft();render()}
  if(ch==="bm"){D.balanceMethod=el.value;saveDraft()}
  if(ch==="theme"){TP={id:el.value};render()}
  if(ch==="themeC"){TP={id:"custom",...curTheme(),id:"custom",[el.id.slice(3)]:el.value};render()}
  if(ch==="of"){OWN.filter=el.value;render()}
  if(el.id==="homeTown"){D.loc=locFromTown(el.value);saveDraft();$("#homeMsg").innerHTML=areaMsg(D.loc)}
  if(el.id==="bookTown"){D.loc=locFromTown(el.value);saveDraft();$("#bookMsg").innerHTML=areaMsg(D.loc);$("aside.summary").innerHTML=summaryBox(quote())}
  if(el.id==="mm"){OWN.mm=el.value;render()}
});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.c){D.cust[el.dataset.c]=el.value;saveDraft()}
  if(el.id==="payR"){D.payNow=+el.value;const q=quote();if(q.total-D.payNow<1)D.payNow=q.total;saveDraft();updPay()}
  if(el.id==="oq"){OWN.q=el.value;clearTimeout(A._q);A._q=setTimeout(()=>{render();const i=$("#oq");i&&(i.focus(),i.setSelectionRange(i.value.length,i.value.length))},300)}
  if(el.id==="radR"){$("#radV").textContent=el.value+" miles";const r0=S.radius;S.radius=+el.value;const p=el.closest(".grid").firstElementChild;const pins=active().filter(b=>b.loc&&b.loc.lat!=null).map(b=>({lat:b.loc.lat,lng:b.loc.lng,label:b.cust.first}));p.innerHTML=radar({pins});}
  if(el.id==="cNum"){el.value=el.value.replace(/\D/g,"").slice(0,19).replace(/(.{4})/g,"$1 ").trim()}
  if(el.id==="cExp"){let v=el.value.replace(/\D/g,"").slice(0,4);if(v.length>2)v=v.slice(0,2)+"/"+v.slice(2);el.value=v}
});
/* smart header: hides on scroll down, returns on scroll up */
let lastY=0;addEventListener("scroll",()=>{const y=scrollY,h=$("#hdr");h.classList.toggle("tuck",y>lastY&&y>160);lastY=y},{passive:true});

/* ---------- boot ---------- */
let ownerSubbed=false;
function subscribeOwner(){if(ownerSubbed)return;ownerSubbed=true;
  store.subCol("bookings",l=>{ALL=[];l.forEach(d=>(d.data.items||[]).forEach(b=>ALL.push({...b,uid:d.id})));rerender()});
  store.sub("site/ledger",d=>{LEDGER=d||{entries:[]};rerender()})}
function subscribeAll(){
  store.sub("site/settings",d=>{S=Object.assign(clone(DEF_SETTINGS),d||{});S.hours=Object.assign(clone(DEF_SETTINGS.hours),S.hours||{});S.social=Object.assign(clone(DEF_SETTINGS.social),S.social||{});rerender()});
  store.sub("site/catalog",d=>{C=Object.assign(clone(DEF_CATALOG),d||{});rerender()});
  store.subCol("posts",l=>{POSTS=l.map(x=>({id:x.id,...x.data})).sort((a,b)=>b.at-a.at);rerender()});
  store.subCol("coupons",l=>{COUPONS=l.map(x=>({id:x.id,...x.data})).sort((a,b)=>b.at-a.at);rerender()});
  store.subCol("slots",l=>{SLOTS={};l.forEach(x=>SLOTS[x.id]=x.data);rerender()});
  if(ME.uid)store.sub("bookings/"+ME.uid,d=>{MY=d;if(d&&d.profile&&!D.cust.email){D.cust={...D.cust,...d.profile};saveDraft()}rerender()});
  if(isOwner())subscribeOwner();
}
render();
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const[db,user,dl]=await Promise.all([use("db"),use("user"),use("downloads")]);
  downloads=dl;
  if(db){store=liveStore(db);ME.live=true;ME.owner=user?await user.isOwner():false;ME.uid=user?await user.id():null}
  else{store=memStore();ME.uid="demo-customer";
    const t=Date.now();store.set("posts/welcome",{title:"Why a two-bucket wash protects your paint",tag:"Tips",emoji:"🪣",color:COVERS[0],at:t,body:"Most swirl marks come from washing, not driving. Every time a mitt picks up grit and drags it across the paint, it leaves a tiny scratch.\n\nWe use one bucket for soapy water and a second for rinsing the mitt, each with a grit guard at the bottom. The dirt stays down there instead of going back on your car.\n\nIt takes a few extra minutes and it's the single biggest reason our customers' paint still looks deep years later."});
    store.set("coupons/demo1",{partner:"Corner Bean Coffee",offer:"Free pastry with any large drink",code:"SHINEBEAN",details:"Show this code at the counter.",at:t})}
  ME.ready=true;subscribeAll();render();
})();
</script>
